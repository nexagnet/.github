name: Central workflow validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/**'
      - 'docs/engineering/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/**'
      - 'docs/engineering/**'

permissions:
  contents: read

jobs:
  contract:
    name: Central workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Actionlint — GitHub Actions syntax and expression validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Validate YAML and executable trust-boundary tests
        run: node --test tests/claude-builder-contract.test.cjs
